name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: go_better_auth_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      matrix:
        go-version: [1.25, 1.26]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: |
          go mod download
          go mod verify

      - name: Run tests
        run: make test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/go_better_auth_test?sslmode=disable

      - name: Run linter
        run: make lint

      - name: Build
        run: make build

      - name: Build examples
        run: make build-examples

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.go-version == '1.25'
        with:
          file: ./coverage.out
